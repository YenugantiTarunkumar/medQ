<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDQ - Smart Healthcare & Hospital Management Platform</title>
    <link rel="stylesheet" href="css/modern.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .hero-box {
            max-width: 650px;
            padding: 40px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo-icon {
            font-size: 56px;
            color: #2dd4bf;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        p {
            font-size: 16px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-launch {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #0284c7, #0d9488);
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            transition: transform 0.2s ease;
        }

        .btn-launch:hover {
            transform: translateY(-2px);
        }

        .badge-tag {
            background: rgba(45, 212, 191, 0.15);
            color: #2dd4bf;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="hero-box">
        <i class="fa-solid fa-notes-medical logo-icon"></i>
        <br>
        <span class="badge-tag"><i class="fa-solid fa-cloud"></i> Firebase Project: medq-5346f Connected</span>
        <h1>MEDQ Healthcare SaaS Platform</h1>
        <p>Smart OPD Queue Management, AI-Assisted Triage Engine, Bed Resource Allocation, and Predictive Inventory
            Forecasting.</p>
        <a href="http://127.0.0.1:5000" class="btn-launch">
            <i class="fa-solid fa-bolt"></i> Launch Application (Localhost 5000)
        </a>
    </div>
</body>

</html>
