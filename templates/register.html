{% extends "base.html" %}

{% block title %}Register - MEDQ Healthcare{% endblock %}

{% block content %}
<div style="max-width:480px; margin:40px auto;" class="card-box">
    <div style="text-align:center; margin-bottom:24px;">
        <i class="fa-solid fa-user-plus fa-3x" style="color:var(--primary);"></i>
        <h2 style="margin-top:12px;">Create MEDQ Account</h2>
        <p style="color:var(--text-muted); font-size:14px;">Select your role and enter details to register</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST">
        <div class="form-group">
            <label for="role">Register As</label>
            <select name="role" id="role" class="form-control" required>
                <option value="PATIENT" selected>Patient</option>
                <option value="DOCTOR">Doctor</option>
                <option value="HOSPITAL_ADMIN">Hospital Administrator</option>
            </select>
        </div>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" name="name" id="name" class="form-control" placeholder="e.g. Ramesh Kumar" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" name="phone" id="phone" class="form-control" placeholder="+91 9876543210" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" class="form-control"
                placeholder="Create a strong password" required>
        </div>

        <button type="submit" class="btn-medq btn-primary" style="width:100%; margin-top:10px;">
            <i class="fa-solid fa-check"></i> Register Account
        </button>
    </form>

    <div style="text-align:center; margin-top:20px; font-size:14px; color:var(--text-muted);">
        Already have an account? <a href="{{ url_for('login') }}" style="color:var(--primary); font-weight:600;">Sign in
            here</a>
    </div>
</div>
{% endblock %}
